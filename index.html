<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebecca Lai — Frontend Software Engineer</title>
    <meta
      name="description"
      content="Rebecca Lai's frontend software engineering portfolio: React and TypeScript projects, production impact at LinkedIn and Pilotly, and an LLM contract-review agent (ClauseCheck)."
    />
    <link rel="icon" href="/images/ninja.ico" type="image/x-icon" />
    <!--
      Apply the saved theme before first paint so there's no light->dark
      (or dark->light) flash. Defaults to dark when nothing is stored yet.
      Wrapped in try/catch per brief: localStorage can throw (private
      browsing, storage disabled).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
